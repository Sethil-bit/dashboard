# Put this file in your repo at: .github/workflows/build-android-apk.yml
# Your repo root must contain index.html (the dashboard).
# Then: GitHub > Actions > "Build Android APK" > Run workflow.
# When it finishes, download "Dashboard-apk" from the run's Artifacts.
name: Build Android APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create Android project
        run: |
          mkdir www && cp index.html www/
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Dashboard" com.dashboard.app --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Dashboard-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
