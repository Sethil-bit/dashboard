function ucalc(){
  const k=$('uk').value,v=+$('uv').value,f=$('uf').value,t=$('ut').value;let r;
  if(k=='Temperature'){const c=f=='°C'?v:f=='°F'?(v-32)*5/9:v-273.15;r=t=='°C'?c:t=='°F'?c*9/5+32:c+273.15}else r=v*UN[k][f]/UN[k][t];
  $('ur').textContent=+r.toFixed(6)+' '+t;
}
function pcalc(){
  const a=+$('pa').value,p=+$('pp').value;if(!a&&!p){$('po').innerHTML='<small>Enter an amount and a percentage.</small>';return}
  $('po').innerHTML=`<div class=r><div class=g>${p}% of amount</div><b>${L(a*p/100)}</b></div><div class=r><div class=g>After ${p}% discount (save ${L(a*p/100)})</div><b>${L(a*(1-p/100))}</b></div><div class=r><div class=g>With ${p}% tax (tax ${L(a*p/100)})</div><b>${L(a*(1+p/100))}</b></div>`;
}
function fcalc(){const c=$('fc').value,r=+$('fr').value;D.fx[c]=r||0;localStorage.setItem('d2',JSON.stringify(D));$('fo').textContent=L(+$('fa').value*r)}
function fxload(){$('fr').value=D.fx[$('fc').value]||'';fcalc()}
const ev2=s=>{let x=s.replace(/π/g,'Math.PI').replace(/sin\(/g,'Math.sin(').replace(/cos\(/g,'Math.cos(').replace(/tan\(/g,'Math.tan(').replace(/sqrt\(/g,'Math.sqrt(').replace(/log\(/g,'Math.log10(').replace(/ln\(/g,'Math.log(').replace(/\^/g,'**');if(!/^[0-9+\-*/().% ]*$/.test(x.replace(/Math\.(PI|sin|cos|tan|sqrt|log10|log)/g,'')))throw 0;return Function('"use strict";return ('+x+')')()};
const fmt=ms=>{const s=ms/1000;return String(Math.floor(s/60)).padStart(2,'0')+':'+(s%60).toFixed(1).padStart(4,'0')};
function drawChat(w){const c=$('cl');if(!c)return;c.innerHTML=chat.map(m=>`<div class="m ${m.role=='user'?'u':'a'}">${e(m.content)}</div>`).join('')+(w?`<div class="m a">…</div>`:'')}
async function ask(){
  const t=$('ai').value.trim();if(!t)return;$('ai').value='';chat.push({role:'user',content:t});drawChat(1);
  try{const r=await api('/functions/v1/assistant',{method:'POST',body:JSON.stringify({messages:chat.slice(-12),context:{openTasks:D.tasks.filter(x=>!x.x).slice(0,10).map(x=>x.t+(x.d?' ('+x.d+')':''))}})});const d=await r.json();if(!r.ok)throw 0;chat.push({role:'assistant',content:d.reply})}
  catch(x){chat.push({role:'assistant',content:'The AI service is not set up yet.'})}
  drawChat();
}
function go(p){
  page=p;clearInterval(sw.h);clearInterval(cdh);sw.h=0;cdh=0;
  $('v').innerHTML=V[p]();
  [...$('nv').children].forEach(b=>b.classList.toggle('on',b.dataset.a=='go:'+p));
  if(p=='tools'){uopts();fxload();if(sw.a)tick()}
  if(p=='ai')drawChat();
}
function tick(){sw.h=setInterval(()=>{const d=$('swd');if(d)d.textContent=fmt(sw.t+Date.now()-sw.a)},100)}
const act={
 go:a=>go(a[1]),
 up:()=>login(1),
 out:()=>{S=null;localStorage.removeItem('au');localStorage.removeItem('d2');D=defs();$('gate').hidden=false},
 del:a=>{D[a[1]]=D[a[1]].filter(x=>x.id!=a[2]);save();go(page)},
 tg:a=>{const x=D[a[1]].find(i=>i.id==a[2]);if(x.r&&x.r!='None'&&!x.x)x.d=add(nxt(x.d||today(),x.r),x.r);else x.x=!x.x;save();go(page)},
 ck:a=>{const n=D.notes.find(i=>i.id==a[1]);n.l[a[2]].d=!n.l[a[2]].d;save();$('nl').innerHTML=nl()},
 w:a=>{D.w[a[1]]=D.w[a[1]]?0:1;save();go('home')},
 chip:a=>{const t=$('ai');t.value=a.slice(1).join(':');t.focus()},
 ai:ask,
 k:a=>{const k=a.slice(1).join(':');
  if(k=='C')cx='';else if(k=='⌫')cx=cx.replace(/(sin\(|cos\(|tan\(|sqrt\(|log\(|ln\(|.)$/,'');
  else if(k=='=')try{cx=String(+ev2(cx).toFixed(10))}catch(x){cx='Error'}
  else{if(cx=='Error')cx='';cx+=['sin','cos','tan','log','ln'].includes(k)?k+'(':k=='√'?'sqrt(':k}
  $('cd').textContent=cx||'0'},
 sw:a=>{if(a[1]=='reset'){clearInterval(sw.h);sw={a:0,t:0,h:0};$('swd').textContent='00:00.0'}else if(sw.a){clearInterval(sw.h);sw.t+=Date.now()-sw.a;sw.a=0}else{sw.a=Date.now();tick()}},
 cd:a=>{clearInterval(cdh);if(a[1]=='stop'){$('cdd').textContent='00:00';return}
  const end=Date.now()+(+$('cm').value||1)*60000;cdh=setInterval(()=>{const l=end-Date.now(),d=$('cdd');if(!d){clearInterval(cdh);return}if(l<=0){clearInterval(cdh);d.textContent='Time up!';navigator.vibrate&&navigator.vibrate([300,150,300])}else d.textContent=fmt(l).slice(0,5)},250)}
};
const v=$('v');
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a.split(':');if(act[a[0]])act[a[0]](a)});
document.addEventListener('submit',ev=>{
  const f=ev.target.dataset.f;if(ev.target.id=='af'){ev.preventDefault();login(0);return}
  if(!f)return;ev.preventDefault();
  const o={id:Date.now()};new FormData(ev.target).forEach((x,k)=>o[k]=String(x).trim());
  if(f=='tx'?!(+o.a>0):!o.t)return;
  if(o.a!==undefined)o.a=+o.a;if(f=='tx'&&!o.d)o.d=today();
  if(f=='notes'&&o.k=='Checklist'){o.l=o.b.split('\n').filter(Boolean).map(t=>({t,d:0}))}
  D[f].unshift(o);save();go(page);
});
document.addEventListener('input',ev=>{
  const t=ev.target,i=t.id;
  if(i=='q'){q=t.value;$('nl').innerHTML=nl()}
  else if(i=='pa'||i=='pp')pcalc();
  else if(i=='uv'||i=='uf'||i=='ut')ucalc();
  else if(i=='fa'||i=='fr')fcalc();
  else if(i=='bud'){D.budget=+t.value||0;save()}
});
document.addEventListener('change',ev=>{const i=ev.target.id;if(i=='uk')uopts();else if(i=='fc')fxload();else if(i=='bud')go('money')});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
$('nv').innerHTML=[['home','🏠','Home'],['tasks','✅','Tasks'],['money','💰','Money'],['tools','🧮','Tools'],['notes','📒','Notes'],['ai','✨','AI']].map(x=>`<button data-a="go:${x[0]}"><b>${x[1]}</b>${x[2]}</button>`).join('');
const h=new Date().getHours();$('hi').textContent=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
$('dt').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
if(S)$('gate').hidden=true;
go('home');if(S)pull();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
