<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A0F20">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%271%27 y2=%271%27%3E%3Cstop stop-color=%27%235A7BFF%27/%3E%3Cstop offset=%271%27 stop-color=%27%23FF5B8A%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%230A0F20%27/%3E%3Crect x=%276%27 y=%276%27 width=%2752%27 height=%2752%27 rx=%2713%27 fill=%27url(%23g)%27/%3E%3Cpath d=%27M18 22h28M18 32h18M18 42h23%27 stroke=%27white%27 stroke-width=%274%27 stroke-linecap=%27round%27/%3E%3Ccircle cx=%2745%27 cy=%2742%27 r=%275%27 fill=%27%23FFC93C%27/%3E%3C/svg%3E">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("dash-theme")||"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0A0F20;--panel:#151C37;--ink:#EEF1FF;--mute:#93A0CB;--soft:#202A52;--dot:rgba(255,255,255,.07);--shadow:rgba(0,0,0,.65);--deep:#0E1A3A;--sw:#3A4672;--on:#EEF1FF;--onfg:#0E1A3A;--out:#4A5683;--hl:#5A2631;--hl2:#6E3140;--hlt:#FFB4A8;--next:linear-gradient(160deg,#2C1D66,#141A42);--coral:#FF5B4A;--r:28px;
  --display:'Bricolage Grotesque',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif;--spring:cubic-bezier(.34,1.56,.64,1)}
:root[data-theme=light]{color-scheme:light;--bg:#E8ECF4;--panel:#fff;--ink:#0E1A3A;--mute:#5E6A8C;--soft:#E8ECF4;--dot:rgba(14,26,58,.14);--shadow:rgba(14,26,58,.4);--sw:#CBD3E6;--on:#0E1A3A;--onfg:#fff;--out:#B6BDD0;--hl:#FFD9D3;--hl2:#FFE9E5;--hlt:#B2271A;--next:#0E1A3A}
*{box-sizing:border-box;margin:0}
body{height:100vh;height:100dvh;overflow:hidden;background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--body)}
body::before{content:'';position:fixed;inset:-40px;z-index:-1;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.4px);background-size:26px 26px;transform:translate(var(--bx,0),var(--by,0));transition:transform .4s ease-out}
.wrap{max-width:1280px;height:100%;margin:0 auto;padding:clamp(12px,2vw,26px);display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px;animation:pop .8s var(--spring) both}
h1{font:800 clamp(26px,3.4vw,40px)/1 var(--display);letter-spacing:-.035em}
.theme{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:0 10px 24px -16px var(--shadow);transition:transform .4s var(--spring),background-color .4s}
.theme:hover{transform:rotate(25deg) scale(1.1)}.theme:active{transform:scale(.9)}
.theme svg{position:absolute;inset:0;margin:auto;width:20px;height:20px;transition:transform .6s var(--spring),opacity .3s}
.theme .sun{transform:rotate(-90deg) scale(0);opacity:0}
:root[data-theme=light] .theme .sun{transform:none;opacity:1}
:root[data-theme=light] .theme .moon{transform:rotate(90deg) scale(0);opacity:0}
.sub{color:var(--mute);margin-top:6px;font-size:14px}
.clocks{display:flex;gap:10px;align-items:center}
.clock{display:flex;align-items:center;gap:10px;background:var(--panel);padding:8px 16px;border-radius:99px;box-shadow:0 10px 24px -16px var(--shadow);transition:background-color .4s}
.clock i{width:8px;height:8px;border-radius:50%;background:#19C99A;animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(25,201,154,.6)}100%{box-shadow:0 0 0 9px transparent}}
.clock b{font:700 17px var(--display);font-variant-numeric:tabular-nums}
.clock span{color:var(--mute);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:auto minmax(0,1fr);gap:14px;flex:1;min-height:0}
.links{grid-column:span 12}.weather,.cal,.next{grid-column:span 4}
.panel{background:var(--panel);border-radius:var(--r);padding:20px 22px;box-shadow:0 18px 40px -24px var(--shadow);transition:background-color .4s;display:flex;flex-direction:column;min-height:0;overflow:auto;scrollbar-width:none;animation:pop .9s var(--spring) both;animation-delay:calc(var(--i)*90ms)}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.93)}}
h2{font:700 17px var(--display);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex:none}
h2 small{font:500 12.5px var(--body);color:var(--mute)}
.hr{display:flex;align-items:center;gap:14px}
/* links */
.links{position:relative;overflow:visible;z-index:5}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));grid-auto-rows:minmax(104px,128px);gap:14px}
.tile{--c:#3B5BFF;--f:#fff;--tx:0px;--ty:0px;--wx:0px;--wy:0px;position:relative;display:flex;flex-direction:column;justify-content:space-between;height:100%;padding:14px 18px 16px;border-radius:24px;overflow:hidden;text-decoration:none;background:var(--c);color:var(--f);
  box-shadow:0 14px 24px -14px var(--c);transform:translate(var(--tx),var(--ty));transition:transform .4s var(--spring),box-shadow .3s}
.tile::before{content:attr(data-l);position:absolute;left:-6px;bottom:-46px;font:800 160px/1 var(--display);opacity:.14;transform:translate(var(--wx),var(--wy));transition:transform .5s ease-out;pointer-events:none}
.tile:hover,.tile:focus-visible{outline:none;transform:translate(var(--tx),calc(var(--ty) - 6px)) rotate(-1.2deg) scale(1.025);box-shadow:0 28px 34px -16px var(--c)}
.tile:active{transform:scale(.95);transition-duration:.1s}
.go{align-self:flex-end;width:42px;height:42px;border-radius:50%;background:var(--f);color:var(--c);display:grid;place-items:center;position:relative;z-index:1;transition:transform .7s var(--spring)}
.tile:hover .go,.tile:focus-visible .go{transform:rotate(360deg) scale(1.12)}
.tx{position:relative;z-index:1;min-width:0}
.tx strong{display:block;font:700 22px/1.1 var(--display);letter-spacing:-.02em}
.tx em{display:block;font-style:normal;font-size:12.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.ink{position:absolute;border-radius:50%;background:var(--deep);pointer-events:none;animation:ink .65s ease-out forwards}
@keyframes ink{from{transform:scale(0);opacity:.4}to{transform:scale(1);opacity:0}}
@keyframes drop{from{opacity:0;transform:translateY(-34px) rotate(-6deg) scale(.8)}}
/* edit toggle + sheet */
.sw{display:flex;align-items:center;gap:8px;background:none;border:0;font:600 13px var(--body);color:var(--mute);cursor:pointer}
.sw i{width:38px;height:22px;border-radius:99px;background:var(--sw);position:relative;transition:background .25s}
.sw i::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .4s var(--spring)}
.sw[aria-checked=true]{color:var(--ink)}.sw[aria-checked=true] i{background:var(--on)}.sw[aria-checked=true] i::after{transform:translateX(16px);background:var(--onfg)}
.sheet{position:absolute;left:0;right:0;top:calc(100% + 10px);z-index:30;background:var(--panel);border-radius:24px;padding:18px 22px 16px;box-shadow:0 34px 70px -24px var(--shadow),0 0 0 1px var(--soft);transform-origin:top;animation:sheet .45s var(--spring)}
.sheet[hidden]{display:none}
@keyframes sheet{from{opacity:0;transform:translateY(-14px) scaleY(.88)}}
.sheet h3{font:700 15px var(--display);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:flex;align-items:center;gap:8px;padding:5px 5px 5px 12px;border-radius:99px;background:var(--soft);font-weight:600;font-size:13px}
.chip b{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip button{border:0;border-radius:99px;padding:5px 11px;font:700 12px var(--body);cursor:pointer;background:var(--panel);color:var(--mute);transition:background .2s,color .2s}
.chip button:hover{color:var(--coral)}.chip button.arm{background:var(--coral);color:#fff}
.add{display:flex;flex-wrap:wrap;gap:8px}
input{flex:1 1 140px;min-width:0;background:var(--soft);border:2px solid transparent;color:var(--ink);padding:10px 14px;border-radius:14px;font:inherit}
input:focus{outline:none;border-color:var(--ink)}
.pill{background:var(--on);border:0;color:var(--onfg);padding:10px 20px;border-radius:14px;font:700 14px var(--body);cursor:pointer;transition:transform .2s var(--spring)}
.pill:hover{transform:translateY(-2px)}.pill:active{transform:scale(.94)}
.ghost{background:none;border:2px solid var(--soft);color:var(--mute);padding:8px 14px;border-radius:14px;font:600 13px var(--body);cursor:pointer}
.msg{font-size:12.5px;color:var(--coral);margin-top:6px}.msg:empty{display:none}
.pickrow{flex:1 1 100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pickrow .lbl{font-size:12.5px;color:var(--mute);font-weight:600}
.sws{display:flex;gap:8px;align-items:center}
.swt,#cc{flex:none;width:26px;height:26px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:0 0 0 2px var(--panel);transition:transform .25s var(--spring),box-shadow .2s}
.swt:hover,#cc:hover{transform:scale(1.15)}
.swt.on,#cc.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
#cc{background:none;overflow:hidden;min-width:0}
#cc::-webkit-color-swatch-wrapper{padding:0}#cc::-webkit-color-swatch{border:0;border-radius:50%}#cc::-moz-color-swatch{border:0;border-radius:50%}
.sheet h3 small{font:500 12px var(--body);color:var(--mute);margin-left:8px}
/* sign-in gate */
.gate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;background:var(--bg)}
.gate[hidden]{display:none}
.gcard{width:min(380px,100%);background:var(--panel);border-radius:28px;padding:28px 24px;display:flex;flex-direction:column;gap:10px;box-shadow:0 34px 70px -24px var(--shadow),0 0 0 1px var(--soft)}
.gcard h2{font:800 28px var(--display)}
.gcard .sub{color:var(--mute);font-size:14px;margin-bottom:6px}
.gcard input{flex:none}
/* weather */
.weather{position:relative;color:#fff;background:var(--sky,linear-gradient(160deg,#3D8BFF,#8FD0FF));transition:background .8s}
.weather>:not(.fx){position:relative;z-index:1}
.weather h2 small{color:rgba(255,255,255,.75)}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit}
[data-k=clear]:not([data-n]) .fx{background:radial-gradient(circle at 88% 6%,rgba(255,236,160,.9),transparent 42%);animation:glow 4s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.5}}
.drop{position:absolute;top:-20px;width:2px;height:18px;background:linear-gradient(transparent,rgba(255,255,255,.75));animation:fall linear infinite}
@keyframes fall{to{top:105%}}
.cloud{position:absolute;left:-200px;width:170px;height:56px;border-radius:99px;background:#fff;filter:blur(12px);animation:cdrift linear infinite}
@keyframes cdrift{to{transform:translateX(640px)}}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.2;transform:scale(.6)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;animation:fl 5s infinite}
@keyframes fl{0%,90%,100%{opacity:0}92%{opacity:.35}95%{opacity:0}97%{opacity:.25}}
.now{display:flex;align-items:center;gap:14px}
.now svg{width:76px;height:76px;flex:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18))}
.temp{font:700 54px/1 var(--display);letter-spacing:-.04em}
.temp sup{font-size:22px;vertical-align:top;opacity:.75}
.cond{opacity:.85;font-size:14px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div,.days>div{padding:9px 10px;border-radius:16px;background:rgba(255,255,255,.2);font-size:12px;backdrop-filter:blur(6px)}
.stats b{display:block;font:700 16px var(--display)}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;font-size:12px}
.days svg{width:30px;height:30px;display:block;margin:3px auto}
.days b{font-weight:700}
.skel{padding:20px 0;opacity:.85}
.rays{transform-origin:32px 32px;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cl{animation:bob 5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-2.5px)}}
.dr{stroke-dasharray:4 6;animation:dfall 1s linear infinite}
@keyframes dfall{to{stroke-dashoffset:-20}}
.bolt{animation:bl 3s infinite}
@keyframes bl{0%,88%,100%{opacity:1}92%{opacity:.2}}
/* calendar */
.nav{display:flex;gap:6px;align-items:center}
.nav button{width:32px;height:32px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);cursor:pointer;font-size:17px;transition:transform .3s var(--spring),background .2s}
.nav button:hover{background:var(--on);color:var(--onfg);transform:scale(1.12)}
.nav b{min-width:112px;text-align:center;font-weight:700}
.dow,.days-g{display:grid;grid-template-columns:repeat(7,1fr)}
.dow{font-size:12px;color:var(--mute);text-align:center;margin-bottom:4px;font-weight:600}
.days-g{flex:1;grid-auto-rows:minmax(28px,1fr);row-gap:4px}
.days-g.sl{animation:sl .45s var(--spring)}.days-g.sr{animation:sr .45s var(--spring)}
@keyframes sl{from{opacity:0;transform:translateX(28px)}}@keyframes sr{from{opacity:0;transform:translateX(-28px)}}
.d{display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;min-height:0}
.d.out{color:var(--out)}
.d.h{background:var(--hl);color:var(--hlt);border-radius:0}
.d.h.hl{border-radius:12px 0 0 12px}.d.h.hr2{border-radius:0 12px 12px 0}.d.h.hl.hr2{border-radius:12px}
.d.h.est{background:repeating-linear-gradient(135deg,var(--hl2) 0 5px,var(--hl) 5px 10px)}
.d.t{background:var(--on);color:var(--onfg);border-radius:12px;box-shadow:0 0 0 3px var(--panel);position:relative;z-index:1}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--mute);margin-top:10px;flex:none;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;background:var(--hl)}
.legend i.e{background:repeating-linear-gradient(135deg,var(--hl2) 0 3px,#FF9B8F 3px 5px)}.legend i.t{background:var(--on)}
/* next */
.next{background:var(--next);color:#fff}
.odo{display:flex;gap:8px;margin:2px 0 10px}
.dg{--dh:clamp(56px,9vh,86px);width:calc(var(--dh)*.72);height:var(--dh);background:#fff;color:var(--deep);border-radius:16px;overflow:hidden;position:relative;font:800 calc(var(--dh)*.7)/1 var(--display);box-shadow:inset 0 -6px 0 rgba(14,26,58,.1)}
.dg::after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(14,26,58,.14)}
.dg div{transition:transform 1.8s cubic-bezier(.2,.9,.2,1)}
.dg span{display:grid;place-items:center;height:var(--dh)}
.nm{font:700 19px/1.25 var(--display)}.nm span{opacity:.6;font-weight:500}
.note{opacity:.7;font-size:12.5px;margin:8px 0 14px}
.up{list-style:none;padding:0;display:grid;gap:7px}
.up li{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-radius:14px;background:rgba(255,255,255,.09);font-size:13px}
.up li span{opacity:.65;white-space:nowrap}.up em{font-style:normal;color:#FF9B8F;font-size:11px;margin-left:6px}
footer{margin-top:10px;color:var(--mute);font-size:11px;text-align:center;flex:none}
.tabs{display:none;position:relative;flex:none;margin-top:10px;padding:5px 5px calc(5px + env(safe-area-inset-bottom,0px));background:var(--panel);border-radius:24px;box-shadow:0 14px 30px -16px var(--shadow)}
.tabs i{position:absolute;top:5px;bottom:calc(5px + env(safe-area-inset-bottom,0px));left:5px;width:calc((100% - 10px)/4);border-radius:19px;background:var(--on);transition:transform .5s var(--spring);transform:translateX(calc(var(--n,0)*100%))}
.tabs button{position:relative;flex:1;background:none;border:0;color:var(--mute);font:700 13px var(--body);padding:11px 2px;cursor:pointer;transition:color .25s}
.tabs button.on{color:var(--onfg)}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
@media(max-width:900px){
  .grid{display:block;grid-template-rows:none}
  .panel{display:none;height:100%;animation-delay:0s}.panel.on{display:flex}
  .tabs{display:flex}footer,.sub{display:none}
  header{margin-bottom:10px}.clocks{gap:6px}.clock{padding:6px 11px;gap:7px}.theme{width:34px;height:34px}.clock b{font-size:14px}.clock span{display:none}
  .cards{grid-template-columns:1fr;grid-auto-rows:minmax(84px,100px)}
  .links{overflow:auto}.sheet{position:static;margin-top:14px;box-shadow:none;background:var(--soft);animation:none}
  .chip{background:var(--panel)}input{background:var(--panel)}
  .temp{font-size:60px}.now svg{width:90px;height:90px}
}
@media(min-width:901px) and (max-height:800px){
  .days,.up{display:none}.note{margin-bottom:0}.stats{margin:8px 0}.cards{grid-auto-rows:84px}.panel{padding:14px 18px}h2{margin-bottom:8px}.nav button{width:28px;height:28px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ===== app pages: planner, money, tools, notes, assistant ===== */
header{order:0}.tabs{order:1}.grid,#xapp{order:2}footer{order:3}#xbot{order:4}
.xnav{display:flex;gap:2px;background:var(--panel);padding:4px;border-radius:99px;box-shadow:0 10px 24px -16px var(--shadow);transition:background-color .4s}
.xnav button{display:flex;align-items:center;gap:7px;background:none;border:0;color:var(--mute);font:700 13px var(--body);padding:8px 14px;border-radius:99px;cursor:pointer;transition:background .25s,color .25s,transform .3s var(--spring)}
.xnav button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.xnav button:hover{transform:translateY(-2px)}.xnav button:active{transform:scale(.94)}.xnav button.on{background:var(--on);color:var(--onfg)}
#xbot{display:none}
#xapp{display:none;overflow:auto;scrollbar-width:none;padding:2px 0 18px}#xapp::-webkit-scrollbar{display:none}
#xapp.on{display:block;flex:1;min-height:0}
.xpg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:14px;align-items:start}
.xpg>*{animation:pop .55s var(--spring) both}.xpg>:nth-child(2){animation-delay:.05s}.xpg>:nth-child(3){animation-delay:.1s}.xpg>:nth-child(n+4){animation-delay:.15s}
#xapp.still *{animation:none!important}
#xapp .c{background:var(--panel);border-radius:var(--r);padding:18px 20px;box-shadow:0 18px 40px -24px var(--shadow);transition:background-color .4s}
#xapp h3,#xapp summary{font:700 17px var(--display);margin-bottom:12px;letter-spacing:-.01em;color:var(--ink)}
#xapp summary{cursor:pointer;margin:0}#xapp details[open] summary{margin-bottom:12px}
#xapp small,#xapp .l{color:var(--mute);font-size:12.5px;font-weight:500}
#xapp input,#xapp select,#xapp textarea{width:100%;flex:none;background:var(--soft);border:2px solid transparent;color:var(--ink);padding:11px 14px;border-radius:14px;font:inherit;transition:border-color .2s}
#xapp textarea{resize:vertical;min-height:84px}
#xapp input:focus,#xapp select:focus,#xapp textarea:focus{outline:0;border-color:var(--ink)}
#xapp input[type=checkbox]{width:22px;height:22px;padding:0;accent-color:var(--on)}
#xapp input[type=file]{padding:9px 10px;font-size:13px}
#xapp option{color:#111}#xapp label.l{display:block}#xapp label.l input{margin-top:4px}
#xapp .f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
#xapp .f>:first-child,#xapp .f textarea,#xapp .f .p{grid-column:1/-1}
#xapp .p{background:var(--on);color:var(--onfg);border:0;border-radius:14px;padding:12px 18px;font:700 14px var(--body);cursor:pointer;transition:transform .25s var(--spring)}
#xapp .p:hover{transform:translateY(-2px)}#xapp .p:active{transform:scale(.95)}
#xapp .x{background:var(--soft);border:0;color:var(--mute);border-radius:12px;padding:7px 12px;font:600 13px var(--body);cursor:pointer;transition:color .2s,transform .25s var(--spring)}
#xapp .x:hover{color:var(--coral)}#xapp .x:active{transform:scale(.92)}
#xapp .r{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--soft);animation:pop .4s var(--spring) both}#xapp .r:first-of-type{border-top:0}
#xapp .g{flex:1;min-width:0}#xapp .g b{display:block;font-weight:700;overflow-wrap:anywhere}
#xapp .dn .g{opacity:.45;text-decoration:line-through}
#xapp .ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--out);background:none;color:var(--onfg);font-size:13px;cursor:pointer;transition:background .2s,border-color .2s,transform .3s var(--spring)}
#xapp .ck:active{transform:scale(.78)}#xapp .dn .ck{background:var(--on);border-color:var(--on)}
#xapp .ch{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);white-space:nowrap}
#xapp .st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#xapp .st>div{background:var(--soft);border-radius:16px;padding:10px;text-align:center}
#xapp .st b{display:block;font:700 15px var(--display);overflow-wrap:anywhere}
#xapp .br{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:12.5px}
#xapp .br div{height:9px;border-radius:9px;background:var(--soft);overflow:hidden}#xapp .br i{display:block;height:100%;border-radius:9px;transform-origin:left;animation:grow .8s var(--spring) both}
@keyframes grow{from{transform:scaleX(0)}}
#xapp .kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#xapp .kp button{background:var(--soft);border:0;border-radius:16px;padding:14px 0;font:700 17px var(--display);color:var(--ink);cursor:pointer;transition:transform .2s var(--spring)}
#xapp .kp button:active{transform:scale(.9)}#xapp .kp .op{background:var(--on);color:var(--onfg)}#xapp .kp .cl{color:var(--coral)}
#xapp #xcd{font:700 32px var(--display);text-align:right;min-height:48px;overflow:auto;white-space:nowrap;padding:4px 6px;letter-spacing:-.02em}
#xapp .big{font:800 32px var(--display);text-align:center;margin:8px 0;font-variant-numeric:tabular-nums;letter-spacing:-.02em;overflow-wrap:anywhere}
#xapp .row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}#xapp .row>*{flex:1 1 130px}
#xapp .q{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#xapp .q button{background:var(--soft);border:0;border-radius:18px;padding:18px 4px;font:700 13px var(--body);color:var(--ink);cursor:pointer;transition:transform .3s var(--spring)}
#xapp .q button:hover{transform:translateY(-3px)}#xapp .q button:active{transform:scale(.94)}
#xcl{max-height:46vh;overflow:auto;margin-bottom:10px}
#xapp .m{padding:10px 14px;border-radius:18px;margin:8px 0;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;animation:pop .35s var(--spring) both}
#xapp .m.u{background:var(--on);color:var(--onfg);margin-left:auto;border-bottom-right-radius:6px}#xapp .m.a{background:var(--soft);border-bottom-left-radius:6px}
#xapp a{color:var(--ink);font-weight:700}
#xapp video,#xapp .qr img{max-width:100%;border-radius:16px;display:block;margin:8px auto}
#xapp .sc{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:10px}
#xapp .sc img{width:100%;height:96px;object-fit:cover;border-radius:12px;display:block;margin-bottom:4px}
@media(max-width:900px){
 .xtop{display:none}
 #xbot{display:flex;flex:none;margin-top:10px;padding:5px 5px calc(5px + env(safe-area-inset-bottom,0px));border-radius:24px;gap:0;box-shadow:0 18px 40px -20px var(--shadow)}
 #xbot button{flex:1;flex-direction:column;gap:2px;padding:8px 0 6px;font-size:11px;border-radius:19px}
 .tabs{margin:0 0 10px}.xpg{grid-template-columns:1fr}
}
/* ===== Launchpad v2 ===== */
#chips{display:none}
.pad{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;align-content:start}
.app{--c:#3B5BFF;--f:#fff;--mx:50%;--my:0%;position:relative;display:flex;flex-direction:column;gap:12px;padding:16px 16px 14px;border-radius:26px;text-decoration:none;color:var(--ink);overflow:hidden;background:linear-gradient(165deg,color-mix(in srgb,var(--c) 16%,var(--panel)),var(--panel) 70%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 22%,transparent),0 14px 28px -20px var(--shadow);transition:transform .45s var(--spring),box-shadow .35s}
.app.in{animation:rise .7s var(--spring) backwards;animation-delay:var(--d,0ms)}
.app::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(220px circle at var(--mx) var(--my),color-mix(in srgb,var(--c) 30%,transparent),transparent 70%)}
.app:hover::after,.app:focus-visible::after{opacity:1}
.app:hover,.app:focus-visible{outline:none;transform:translateY(-6px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent),0 26px 34px -18px var(--c)}
.app:active{transform:scale(.96);transition-duration:.12s}
.ic{position:relative;z-index:1;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font:800 24px var(--display);color:var(--f);background:linear-gradient(145deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));box-shadow:0 12px 22px -10px var(--c),inset 0 1px rgba(255,255,255,.35);transition:transform .5s var(--spring)}
.app:hover .ic{transform:scale(1.1) rotate(-6deg)}
.app strong{position:relative;z-index:1;font:700 18px/1.15 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
.app em{position:relative;z-index:1;font-style:normal;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-6px}
.arr{position:absolute;z-index:1;top:16px;right:16px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--ink);opacity:0;transform:translate(-6px,6px) scale(.7);transition:opacity .25s,transform .45s var(--spring)}
.app:hover .arr,.app:focus-visible .arr{opacity:1;transform:none}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.9);filter:blur(6px)}}
.rm{display:none;position:absolute;z-index:3;top:10px;left:10px;height:26px;min-width:26px;padding:0 9px;border:0;border-radius:99px;background:var(--coral);color:#fff;font:700 13px var(--body);cursor:pointer;box-shadow:0 6px 14px -4px var(--coral);align-items:center;justify-content:center}
.pad.edit .rm{display:flex;animation:pop .4s var(--spring)}
.pad.edit .app{animation:wig .5s ease-in-out infinite alternate;animation-delay:var(--w,0ms)}
.pad.edit .arr{display:none}
@keyframes wig{from{transform:rotate(-1.1deg)}to{transform:rotate(1.1deg)}}
.app.out{animation:none!important;transition:transform .35s ease-in,opacity .35s;transform:scale(.4) rotate(8deg);opacity:0}
.addt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:140px;border:2px dashed var(--out);border-radius:26px;background:none;color:var(--mute);font:700 14px var(--body);cursor:pointer;animation:pop .45s var(--spring) both;transition:color .2s,border-color .2s,transform .4s var(--spring)}
.addt:hover{color:var(--ink);border-color:var(--ink);transform:translateY(-4px)}
.addt svg{width:28px;height:28px}
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:34px 20px;border-radius:28px;border:2px dashed var(--out);animation:rise .7s var(--spring) backwards}
.empty svg{width:64px;height:64px;color:var(--ink);animation:float 3.2s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-8px) rotate(-4deg)}}
.empty h3{font:800 22px var(--display);letter-spacing:-.02em}.empty p{color:var(--mute);max-width:360px;font-size:14px}
@media(max-width:900px){.pad{grid-template-columns:repeat(2,1fr);gap:12px}.app{padding:14px}.ic{width:48px;height:48px;font-size:22px}.app strong{font-size:16px}.arr{opacity:1;transform:none;top:14px;right:14px;width:26px;height:26px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Dashboard</h1><p class="sub" id="greet"></p></div>
    <nav class="xnav xtop" id="xtop" aria-label="Sections"></nav>
    <div class="clocks">
      <div class="clock"><i></i><b id="tK">--:--:--</b><span>Kandy</span></div>
      <div class="clock"><i></i><b id="tB">--:--:--</b><span>Beijing</span></div>
      <button class="theme" id="theme" type="button" aria-label="Switch theme"><svg class="moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3 17 7M7 17l-1.7 1.7"/></svg></button>

          <button class="pill" type="submit">Add link</button>
          <button class="ghost" type="button" id="reset">Clear all</button>

        </form>
        <p class="msg" id="msg" role="status"></p>
      </div>
    </section>
    <section class="panel weather" id="wxp" style="--i:2" aria-labelledby="hw">
      <div class="fx" id="fx"></div>
      <h2 id="hw">Weather in Kandy <small id="wu"></small></h2>
      <div id="wx"><p class="skel">Loading forecast...</p></div>
    </section>

      <h2 id="hc">China holidays
        <span class="nav"><button id="pv" aria-label="Previous month">&lsaquo;</button><b id="mt"></b><button id="nx" aria-label="Next month">&rsaquo;</button></span>
      </h2>

      <h2 id="hn">Next China holiday</h2>
      <div id="nextbox"></div>
    </section>
  </main>
  <footer>Developed by Sethil</footer>
  <nav class="tabs" id="tabs" aria-label="Dashboard sections">
    <i></i>
    <button class="on" data-t="links" type="button">Links</button>
    <button data-t="weather" type="button">Weather</button>
    <button data-t="cal" type="button">Calendar</button>
    <button data-t="next" type="button">Next</button>
  </nav>
  <main id="xapp" aria-live="polite"></main>
  <nav class="xnav" id="xbot" aria-label="Sections"></nav>
</div>
<div class="gate" id="gate">
  <form class="gcard" id="authf">
    <h2>Dashboard</h2>
    <p class="sub">Sign in to open your dashboard.</p>
    <input id="em" type="email" placeholder="Email" autocomplete="email" required>
    <input id="pw" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password" minlength="6" required>
    <button class="pill" type="submit">Sign in</button>
    <button class="ghost" type="button" id="signup">Create account</button>
    <p class="msg" id="amsg" role="status"></p>
  </form>
</div>
<script>
/* ---------- Data you can edit ---------- */
const DEFAULT_LINKS=[];
// est:1 = expected pattern, not yet officially announced
const HOLIDAYS=[
  {n:"New Year's Day",cn:'元旦',s:'2026-01-01',e:'2026-01-03'},
  {n:'Spring Festival',cn:'春节',s:'2026-02-15',e:'2026-02-23'},
  {n:'Qingming Festival',cn:'清明节',s:'2026-04-04',e:'2026-04-06'},
  {n:'Labour Day',cn:'劳动节',s:'2026-05-01',e:'2026-05-05'},
  {n:'Dragon Boat Festival',cn:'端午节',s:'2026-06-19',e:'2026-06-21'},
  {n:'Mid-Autumn Festival',cn:'中秋节',s:'2026-09-25',e:'2026-09-27'},
  {n:'National Day',cn:'国庆节',s:'2026-10-01',e:'2026-10-07'},
  {n:"New Year's Day",cn:'元旦',s:'2027-01-01',e:'2027-01-03',est:1},
  {n:'Spring Festival',cn:'春节',s:'2027-02-05',e:'2027-02-11',est:1},
  {n:'Qingming Festival',cn:'清明节',s:'2027-04-03',e:'2027-04-05',est:1},
  {n:'Labour Day',cn:'劳动节',s:'2027-05-01',e:'2027-05-05',est:1},
  {n:'Dragon Boat Festival',cn:'端午节',s:'2027-06-09',e:'2027-06-11',est:1},
  {n:'Mid-Autumn Festival',cn:'中秋节',s:'2027-09-15',e:'2027-09-17',est:1},
  {n:'National Day',cn:'国庆节',s:'2027-10-01',e:'2027-10-07',est:1}
];
const KANDY={lat:7.2906,lon:80.6337};
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const toDate=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const fmt=(d,o)=>d.toLocaleDateString('en-GB',o);
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* theme: dark by default, choice is remembered */
$('theme').onclick=()=>{
  const t=document.documentElement.dataset.theme==='light'?'dark':'light';
  document.documentElement.dataset.theme=t;
  document.querySelector('meta[name=theme-color]').content=t==='light'?'#E8ECF4':'#0A0F20';
  try{localStorage.setItem('dash-theme',t)}catch(e){}
};
/* background parallax */
addEventListener('pointermove',e=>{
  document.body.style.setProperty('--bx',((e.clientX/innerWidth-.5)*-16)+'px');
  document.body.style.setProperty('--by',((e.clientY/innerHeight-.5)*-16)+'px');
});

/* clocks + greeting */
function tick(){
  const now=new Date(),t=tz=>now.toLocaleTimeString('en-GB',{timeZone:tz,hour12:false});
  $('tK').textContent=t('Asia/Colombo');$('tB').textContent=t('Asia/Shanghai');
  const h=+now.toLocaleTimeString('en-GB',{timeZone:'Asia/Colombo',hour:'2-digit',hour12:false});
  $('greet').textContent=(h<12?'Good morning':h<18?'Good afternoon':'Good evening')+' - '+fmt(now,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
tick();setInterval(tick,1000);

/* ---------- Links ---------- */
let links;let syncTxt='';let pendingOps=0;
try{links=JSON.parse(localStorage.getItem('dash-links')||localStorage.getItem('indra-links'))}catch(e){}
if(!Array.isArray(links)||!links.length)links=DEFAULT_LINKS.slice();
const save=()=>{try{localStorage.setItem('dash-links',JSON.stringify(links))}catch(e){}};
try{ /* one-time: add any new default links to a list saved earlier */
  if(localStorage.getItem('dash-seed')!=='1'){
    DEFAULT_LINKS.forEach(d=>{if(!links.some(l=>l.u===d.u))links.push(d)});
    localStorage.setItem('dash-seed','1');save();
  }
}catch(e){}
try{if(localStorage.getItem('dash-wipe1')!=='1'){links=[];save();localStorage.setItem('dash-wipe1','1');localStorage.setItem('dash-wipe-srv','1')}}catch(e){}
const PAL=[['#3B5BFF','#fff'],['#FF5B4A','#fff'],['#FFC93C','#0E1A3A'],['#19C99A','#06281F'],['#8A5BFF','#fff'],['#FF7AB6','#3A0F24']];
const ink=h=>{const m=/^#?([0-9a-f]{6})$/i.exec(h);if(!m)return'#fff';const n=parseInt(m[1],16),y=(0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255));return y>150?'#0E1A3A':'#fff'};
const pal=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length]};
function burst(x,y,col){
  if(calm)return;
  for(let i=0;i<14;i++){
    const p=document.createElement('i'),a=Math.random()*6.28,d=50+Math.random()*70;
    p.style.cssText=`position:fixed;left:${x}px;top:${y}px;width:9px;height:9px;border-radius:50%;background:${i%2?col:'#fff'};pointer-events:none;z-index:99`;
    document.body.appendChild(p);
    p.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d}px)) scale(0)`,opacity:0}],{duration:600+Math.random()*300,easing:'cubic-bezier(.2,.8,.2,1)'}).onfinish=()=>p.remove();
  }
}
function delLink(l){
  const i=links.indexOf(l);if(i<0)return;
  links.splice(i,1);save();renderLinks();
  if(l.id){pendingOps++;sb('?id=eq.'+l.id,{method:'DELETE'}).then(()=>setSync(' · synced')).catch(syncFail).finally(()=>pendingOps--)}
}
function renderLinks(anim){
  const edit=$('sw').getAttribute('aria-checked')==='true',box=$('cards'),hov=matchMedia('(hover:hover)').matches;
  $('lc').textContent=(links.length?links.length+' saved':'No links yet')+syncTxt;
  box.className='pad'+(edit?' edit':'');box.innerHTML='';
  if(!links.length){
    const d=document.createElement('div');d.className='empty';
    d.innerHTML='<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="20" height="20" rx="7"/><rect x="36" y="8" width="20" height="20" rx="7"/><rect x="8" y="36" width="20" height="20" rx="7"/><path d="M46 36v20M36 46h20"/></svg><h3>Your Launchpad is empty</h3><p>Add the websites and apps you use every day. Your links stay private to your account.</p>'+(edit?'':'<button class="pill" type="button">Add your first link</button>');
    const b=d.querySelector('button');if(b)b.onclick=()=>{$('sw').click();setTimeout(()=>$('nm').focus(),60)};
    box.appendChild(d);
  }
  links.forEach((l,i)=>{
    const [c,f]=l.c?[l.c,ink(l.c)]:pal(l.n),a=document.createElement('a');
    a.className='app'+(anim==='all'||anim===i?' in':'');
    a.style.cssText='--c:'+c+';--f:'+f+';--d:'+(anim==='all'?120+i*70:0)+'ms;--w:'+(-(i%5)*90)+'ms';
    let shown=l.u;try{const u=new URL(l.u);shown=u.host+u.pathname.replace(/\/$/,'')}catch(e){}
    a.href=l.u;a.target='_blank';a.rel='noopener noreferrer';a.title=l.n;
    a.innerHTML='<span class="ic"></span><strong></strong><em></em><span class="arr"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></span><button type="button" class="rm" aria-label="Remove link">×</button>';
    a.querySelector('.ic').textContent=(l.n.trim().charAt(0)||'?').toUpperCase();
    a.querySelector('strong').textContent=l.n;a.querySelector('em').textContent=shown;
    a.addEventListener('click',ev=>{if(box.classList.contains('edit'))ev.preventDefault()});
    a.addEventListener('pointerdown',ev=>{if(!box.classList.contains('edit'))burst(ev.clientX,ev.clientY,c)});
    if(hov)a.addEventListener('pointermove',ev=>{const r=a.getBoundingClientRect();a.style.setProperty('--mx',ev.clientX-r.left+'px');a.style.setProperty('--my',ev.clientY-r.top+'px')});
    const rm=a.querySelector('.rm');let t;
    rm.addEventListener('click',ev=>{
      ev.preventDefault();ev.stopPropagation();
      if(rm.classList.contains('arm')){clearTimeout(t);a.classList.add('out');setTimeout(()=>delLink(l),330);return}
      rm.classList.add('arm');rm.textContent='Delete?';
      t=setTimeout(()=>{rm.classList.remove('arm');rm.textContent='×'},2600);
    });
    box.appendChild(a);
  });
  if(edit){
    const b=document.createElement('button');b.type='button';b.className='addt';
    b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add link</span>';
    b.onclick=()=>{$('nm').focus();$('sheet').scrollIntoView({block:'nearest',behavior:'smooth'})};
    box.appendChild(b);
  }
}
/* edit mode: delete lives only in this sheet, behind a toggle and a second tap */
function renderChips(){
  const wrap=$('chips');wrap.innerHTML='';
  links.forEach((l,i)=>{
    const ch=document.createElement('div');ch.className='chip';ch.style.setProperty('--c',l.c||pal(l.n)[0]);
    ch.innerHTML='<b></b><span></span><button type="button">Delete</button>';
    ch.querySelector('span').textContent=l.n;

function summarize(t){

  if(s.length<=3)return s.join(' ')||t.slice(0,300);

}

async function addScan(f){if(!f)return;const t=($('xsn').value||'Scan '+today()).trim();try{const u=await shrink(f);await idbDo('readwrite',s=>s.put({id:Date.now(),t,u}))}catch(x){}loadScans()}
async function qrm(){const t=$('xqt').value.trim(),o=$('xqo');if(!t)return;try{await lib(QRU);const g=qrcode(0,'M');g.addData(t);g.make();const u=g.createDataURL(8,3);o.innerHTML=`<img src="${u}" alt="QR code" style="width:230px;image-rendering:pixelated;background:#fff"><div class=row><a href="${u}" download="qr.gif">Download QR</a></div>`}catch(x){o.innerHTML='<small>Could not load the QR library. Check your internet connection.</small>'}}
function stopScan(){clearInterval(scanT);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;const v=$('xqv');if(v)v.hidden=true}
async function scan(){
  const v=$('xqv'),o=$('xqr');o.textContent='';
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;v.hidden=false;await v.play();
    let det=null;if('BarcodeDetector' in window)det=new BarcodeDetector({formats:['qr_code']});else await lib(JSQR);
    const cv=document.createElement('canvas'),c2=cv.getContext('2d',{willReadFrequently:true});
    scanT=setInterval(async()=>{let t='';try{if(det){const r=await det.detect(v);t=r[0]&&r[0].rawValue}else if(v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;c2.drawImage(v,0,0);const d=c2.getImageData(0,0,cv.width,cv.height),r=jsQR(d.data,d.width,d.height);t=r&&r.data}}catch(x){}
      if(t){stopScan();o.innerHTML='<b>'+e(t)+'</b>'+(/^https?:/i.test(t)?'<div class=row><a href="'+e(t)+'" target=_blank rel=noopener>Open link</a></div>':'')}},300)}
  catch(x){o.innerHTML='<small>Camera not available. Allow camera access (the page must use https).</small>'}
}
const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:'application/pdf'}));a.download=n;a.click()};
async function pdf(kind){
  const m=$('xpm'),fs=[...$('xpf').files];if(!fs.length){m.textContent='Choose PDF file(s) first.';return}
  m.textContent='Working...';
  try{await lib(PDFU);const {PDFDocument}=PDFLib;
    if(kind=='merge'){if(fs.length<2){m.textContent='Select 2 or more PDFs.';return}const o=await PDFDocument.create();for(const f of fs){const d=await PDFDocument.load(await f.arrayBuffer());(await o.copyPages(d,d.getPageIndices())).forEach(p=>o.addPage(p))}dl(await o.save(),'combined.pdf');m.textContent='Done: combined.pdf'}
    else{const d=await PDFDocument.load(await fs[0].arrayBuffer()),n=d.getPageCount(),del=new Set();
      $('xpq').value.split(',').forEach(s=>{const [a,b]=s.split('-').map(x=>parseInt(x));if(a)for(let i=a;i<=(b||a);i++)if(i>=1&&i<=n)del.add(i-1)});
      if(!del.size||del.size>=n){m.textContent='Enter valid pages (1-'+n+'), but not all of them.';return}
      [...del].sort((a,b)=>b-a).forEach(i=>d.removePage(i));dl(await d.save(),'edited.pdf');m.textContent='Done: removed '+del.size+' of '+n+' pages'}
  }catch(x){m.textContent='Could not process this PDF.'}
}
function tick(){sw.h=setInterval(()=>{const d=$('xswd');if(d)d.textContent=fmt(sw.t+Date.now()-sw.a)},100)}
const act={
 go:a=>go(a[1]),
 del:a=>{D[a[1]]=D[a[1]].filter(x=>x.id!=a[2]);save();go(page,1)},
 tg:a=>{const x=D[a[1]].find(i=>i.id==a[2]);if(x.r&&x.r!='None'&&!x.x)x.d=add(nxt(x.d||today(),x.r),x.r);else x.x=!x.x;save();go(page,1)},
 ck:a=>{const n=D.notes.find(i=>i.id==a[1]);n.l[a[2]].d=!n.l[a[2]].d;save();$('xnl').innerHTML=nl()},
 w:a=>{D.w[a[1]]=D.w[a[1]]?0:1;save();go('planner',1)},
 chip:a=>{const t=$('xai');t.value=a.slice(1).join(':');t.focus()},
 ai:ask,
 k:a=>{const k=a.slice(1).join(':');
  if(k=='C')cx='';else if(k=='⌫')cx=cx.replace(/(sin\(|cos\(|tan\(|sqrt\(|log\(|ln\(|.)$/,'');
  else if(k=='=')try{cx=String(+ev2(cx).toFixed(10))}catch(x){cx='Error'}
  else{if(cx=='Error')cx='';cx+=['sin','cos','tan','log','ln'].includes(k)?k+'(':k=='√'?'sqrt(':k}
  $('xcd').textContent=cx||'0'},
 sw:a=>{if(a[1]=='reset'){clearInterval(sw.h);sw={a:0,t:0,h:0};$('xswd').textContent='00:00.0'}else if(sw.a){clearInterval(sw.h);sw.t+=Date.now()-sw.a;sw.a=0}else{sw.a=Date.now();tick()}},
 cd:a=>{clearInterval(cdh);if(a[1]=='stop'){$('xcdd').textContent='00:00';return}
  const end=Date.now()+(+$('xcm').value||1)*60000;cdh=setInterval(()=>{const l=end-Date.now(),d=$('xcdd');if(!d){clearInterval(cdh);return}if(l<=0){clearInterval(cdh);d.textContent='Time up!';navigator.vibrate&&navigator.vibrate([300,150,300])}else d.textContent=fmt(l).slice(0,5)},250)}
};

act.qr=a=>a[1]=='make'?qrm():scan();
act.pdf=a=>pdf(a[1]);
act.scd=async a=>{try{await idbDo('readwrite',s=>s.delete(+a[1]))}catch(x){}loadScans()};
function go(p,keep){
  p=({tasks:'planner'})[p]||p;
  const same=p==last,st=X.scrollTop;last=p;page=p;
  clearInterval(sw.h);clearInterval(cdh);sw.h=0;cdh=0;stopScan();
  const home=p=='home';
  document.querySelector('.grid').style.display=home?'':'none';
  $('tabs').style.display=home?'':'none';
  X.classList.toggle('on',!home);
  document.querySelectorAll('.xnav button').forEach(b=>b.classList.toggle('on',b.dataset.p==p));
  if(home)return;
  X.classList.toggle('still',!!(keep&&same));
  X.innerHTML='<div class=xpg>'+V[p]()+'</div><p style="text-align:center;margin-top:14px"><small>'+e(syn)+'</small></p>';
  X.scrollTop=keep&&same?st:0;
  if(p=='tools'){uopts();fxload();if(sw.a)tick()}
  if(p=='ai')drawChat();
  if(p=='notes')loadScans();
}
X.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a.split(':');if(act[a[0]])act[a[0]](a)});
X.addEventListener('submit',ev=>{
  const f=ev.target.dataset.f;if(!f)return;ev.preventDefault();
  const o={id:Date.now()};new FormData(ev.target).forEach((x,k)=>o[k]=String(x).trim());
  if(f=='tx'?!(+o.a>0):!o.t)return;
  if(o.a!==undefined)o.a=+o.a;if(f=='tx'&&!o.d)o.d=today();
  if(f=='notes'&&o.k=='Checklist')o.l=o.b.split('\n').filter(Boolean).map(t=>({t,d:0}));
  D[f].unshift(o);save();go(page,1);
});
X.addEventListener('input',ev=>{
  const t=ev.target,i=t.id;
  if(i=='xq'){q=t.value;$('xnl').innerHTML=nl()}
  else if(i=='xpa'||i=='xpp')pcalc();
  else if(i=='xuv'||i=='xuf'||i=='xut')ucalc();
  else if(i=='xfa'||i=='xfr')fcalc();
  else if(i=='xbud'){D.budget=+t.value||0;save()}
});
X.addEventListener('change',ev=>{const i=ev.target.id;if(i=='xuk')uopts();else if(i=='xfc')fxload();else if(i=='xbud')go('money',1);else if(i=='xsf')addScan(ev.target.files[0])});
const NAV=[['home','Home','<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],['planner','Planner','<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>'],['money','Money','<path d="M3 7a2 2 0 0 1 2-2h13v4"/><path d="M3 7v11a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2z"/><circle cx="16.5" cy="14.5" r="1.2"/>'],['tools','Tools','<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2m4 0h2M8 16h2m4 0h2"/>'],['notes','Notes','<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>'],['ai','Assistant','<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>']];
const nav=NAV.map(([k,l,p])=>`<button type="button" data-p="${k}"><svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>${l}</button>`).join('');
$('xtop').innerHTML=nav;$('xbot').innerHTML=nav;
document.querySelectorAll('.xnav').forEach(n=>n.addEventListener('click',ev=>{const b=ev.target.closest('button');if(b)go(b.dataset.p)}));
const _sl=sbLoad;sbLoad=async function(){await _sl();pull()};
$('signout').addEventListener('click',()=>{localStorage.removeItem('d2');D=defs();go('home')});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
go('home');pull();
window.__x={go,D:()=>D,act};
})();

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
