<style>
:root{color-scheme:dark;--bg:#0A0F20;--panel:#151C37;--ink:#EEF1FF;--mute:#93A0CB;--soft:#202A52;--dot:rgba(255,255,255,.07);--shadow:rgba(0,0,0,.65);--deep:#0E1A3A;--sw:#3A4672;--on:#EEF1FF;--onfg:#0E1A3A;--out:#4A5683;--hl:#5A2631;--hl2:#6E3140;--hlt:#FFB4A8;--next:linear-gradient(160deg,#2C1D66,#141A42);--coral:#FF5B4A;--r:28px;
  --display:'Bricolage Grotesque',system-ui,sans-serif;--body:'Figtree',system-ui,sans-serif;--spring:cubic-bezier(.34,1.56,.64,1)}
:root[data-theme=light]{color-scheme:light;--bg:#E8ECF4;--panel:#fff;--ink:#0E1A3A;--mute:#5E6A8C;--soft:#E8ECF4;--dot:rgba(14,26,58,.14);--shadow:rgba(14,26,58,.4);--sw:#CBD3E6;--on:#0E1A3A;--onfg:#fff;--out:#B6BDD0;--hl:#FFD9D3;--hl2:#FFE9E5;--hlt:#B2271A;--next:#0E1A3A}
*{box-sizing:border-box;margin:0}
body{height:100vh;height:100dvh;overflow:hidden;background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--body)}
body::before{content:'';position:fixed;inset:-40px;z-index:-1;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.4px);background-size:26px 26px;transform:translate(var(--bx,0),var(--by,0));transition:transform .4s ease-out}
.wrap{max-width:1280px;height:100%;margin:0 auto;padding:clamp(12px,2vw,26px);display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px;animation:pop .8s var(--spring) both}
h1{font:800 clamp(26px,3.4vw,40px)/1 var(--display);letter-spacing:-.035em}
.theme{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:0 10px 24px -16px var(--shadow);transition:transform .4s var(--spring),background-color .4s}
.theme:hover{transform:rotate(25deg) scale(1.1)}.theme:active{transform:scale(.9)}
.theme svg{position:absolute;inset:0;margin:auto;width:20px;height:20px;transition:transform .6s var(--spring),opacity .3s}
.theme .sun{transform:rotate(-90deg) scale(0);opacity:0}
:root[data-theme=light] .theme .sun{transform:none;opacity:1}
:root[data-theme=light] .theme .moon{transform:rotate(90deg) scale(0);opacity:0}
.sub{color:var(--mute);margin-top:6px;font-size:14px}
.clocks{display:flex;gap:10px;align-items:center}
.clock{display:flex;align-items:center;gap:10px;background:var(--panel);padding:8px 16px;border-radius:99px;box-shadow:0 10px 24px -16px var(--shadow);transition:background-color .4s}
.clock i{width:8px;height:8px;border-radius:50%;background:#19C99A;animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(25,201,154,.6)}100%{box-shadow:0 0 0 9px transparent}}
.clock b{font:700 17px var(--display);font-variant-numeric:tabular-nums}
.clock span{color:var(--mute);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:auto minmax(0,1fr);gap:14px;flex:1;min-height:0}
.links{grid-column:span 12}.weather,.cal,.next{grid-column:span 4}
.panel{background:var(--panel);border-radius:var(--r);padding:20px 22px;box-shadow:0 18px 40px -24px var(--shadow);transition:background-color .4s;display:flex;flex-direction:column;min-height:0;overflow:auto;scrollbar-width:none;animation:pop .9s var(--spring) both;animation-delay:calc(var(--i)*90ms)}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.93)}}
h2{font:700 17px var(--display);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex:none}
h2 small{font:500 12.5px var(--body);color:var(--mute)}
.hr{display:flex;align-items:center;gap:14px}
/* links */
.links{position:relative;overflow:visible;z-index:5}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));grid-auto-rows:minmax(104px,128px);gap:14px}
.tile{--c:#3B5BFF;--f:#fff;--tx:0px;--ty:0px;--wx:0px;--wy:0px;position:relative;display:flex;flex-direction:column;justify-content:space-between;height:100%;padding:14px 18px 16px;border-radius:24px;overflow:hidden;text-decoration:none;background:var(--c);color:var(--f);
  box-shadow:0 14px 24px -14px var(--c);transform:translate(var(--tx),var(--ty));transition:transform .4s var(--spring),box-shadow .3s}
.tile::before{content:attr(data-l);position:absolute;left:-6px;bottom:-46px;font:800 160px/1 var(--display);opacity:.14;transform:translate(var(--wx),var(--wy));transition:transform .5s ease-out;pointer-events:none}
.tile:hover,.tile:focus-visible{outline:none;transform:translate(var(--tx),calc(var(--ty) - 6px)) rotate(-1.2deg) scale(1.025);box-shadow:0 28px 34px -16px var(--c)}
.tile:active{transform:scale(.95);transition-duration:.1s}
.go{align-self:flex-end;width:42px;height:42px;border-radius:50%;background:var(--f);color:var(--c);display:grid;place-items:center;position:relative;z-index:1;transition:transform .7s var(--spring)}
.tile:hover .go,.tile:focus-visible .go{transform:rotate(360deg) scale(1.12)}
.tx{position:relative;z-index:1;min-width:0}
.tx strong{display:block;font:700 22px/1.1 var(--display);letter-spacing:-.02em}
.tx em{display:block;font-style:normal;font-size:12.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.ink{position:absolute;border-radius:50%;background:var(--deep);pointer-events:none;animation:ink .65s ease-out forwards}
@keyframes ink{from{transform:scale(0);opacity:.4}to{transform:scale(1);opacity:0}}
@keyframes drop{from{opacity:0;transform:translateY(-34px) rotate(-6deg) scale(.8)}}
/* edit toggle + sheet */
.sw{display:flex;align-items:center;gap:8px;background:none;border:0;font:600 13px var(--body);color:var(--mute);cursor:pointer}
.sw i{width:38px;height:22px;border-radius:99px;background:var(--sw);position:relative;transition:background .25s}
.sw i::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .4s var(--spring)}
.sw[aria-checked=true]{color:var(--ink)}.sw[aria-checked=true] i{background:var(--on)}.sw[aria-checked=true] i::after{transform:translateX(16px);background:var(--onfg)}
.sheet{position:absolute;left:0;right:0;top:calc(100% + 10px);z-index:30;background:var(--panel);border-radius:24px;padding:18px 22px 16px;box-shadow:0 34px 70px -24px var(--shadow),0 0 0 1px var(--soft);transform-origin:top;animation:sheet .45s var(--spring)}
.sheet[hidden]{display:none}
@keyframes sheet{from{opacity:0;transform:translateY(-14px) scaleY(.88)}}
.sheet h3{font:700 15px var(--display);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{display:flex;align-items:center;gap:8px;padding:5px 5px 5px 12px;border-radius:99px;background:var(--soft);font-weight:600;font-size:13px}
.chip b{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip button{border:0;border-radius:99px;padding:5px 11px;font:700 12px var(--body);cursor:pointer;background:var(--panel);color:var(--mute);transition:background .2s,color .2s}
.chip button:hover{color:var(--coral)}.chip button.arm{background:var(--coral);color:#fff}
.add{display:flex;flex-wrap:wrap;gap:8px}
input{flex:1 1 140px;min-width:0;background:var(--soft);border:2px solid transparent;color:var(--ink);padding:10px 14px;border-radius:14px;font:inherit}
input:focus{outline:none;border-color:var(--ink)}
.pill{background:var(--on);border:0;color:var(--onfg);padding:10px 20px;border-radius:14px;font:700 14px var(--body);cursor:pointer;transition:transform .2s var(--spring)}
.pill:hover{transform:translateY(-2px)}.pill:active{transform:scale(.94)}
.ghost{background:none;border:2px solid var(--soft);color:var(--mute);padding:8px 14px;border-radius:14px;font:600 13px var(--body);cursor:pointer}
.msg{font-size:12.5px;color:var(--coral);margin-top:6px}.msg:empty{display:none}
.pickrow{flex:1 1 100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pickrow .lbl{font-size:12.5px;color:var(--mute);font-weight:600}
.sws{display:flex;gap:8px;align-items:center}
.swt,#cc{flex:none;width:26px;height:26px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:0 0 0 2px var(--panel);transition:transform .25s var(--spring),box-shadow .2s}
.swt:hover,#cc:hover{transform:scale(1.15)}
.swt.on,#cc.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
#cc{background:none;overflow:hidden;min-width:0}
#cc::-webkit-color-swatch-wrapper{padding:0}#cc::-webkit-color-swatch{border:0;border-radius:50%}#cc::-moz-color-swatch{border:0;border-radius:50%}
.sheet h3 small{font:500 12px var(--body);color:var(--mute);margin-left:8px}
/* sign-in gate */
.gate{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;background:var(--bg)}
.gate[hidden]{display:none}
.gcard{width:min(380px,100%);background:var(--panel);border-radius:28px;padding:28px 24px;display:flex;flex-direction:column;gap:10px;box-shadow:0 34px 70px -24px var(--shadow),0 0 0 1px var(--soft)}
.gcard h2{font:800 28px var(--display)}
.gcard .sub{color:var(--mute);font-size:14px;margin-bottom:6px}
.gcard input{flex:none}
/* weather */
.weather{position:relative;color:#fff;background:var(--sky,linear-gradient(160deg,#3D8BFF,#8FD0FF));transition:background .8s}
.weather>:not(.fx){position:relative;z-index:1}
.weather h2 small{color:rgba(255,255,255,.75)}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit}
[data-k=clear]:not([data-n]) .fx{background:radial-gradient(circle at 88% 6%,rgba(255,236,160,.9),transparent 42%);animation:glow 4s ease-in-out infinite alternate}
@keyframes glow{to{opacity:.5}}
.drop{position:absolute;top:-20px;width:2px;height:18px;background:linear-gradient(transparent,rgba(255,255,255,.75));animation:fall linear infinite}
@keyframes fall{to{top:105%}}
.cloud{position:absolute;left:-200px;width:170px;height:56px;border-radius:99px;background:#fff;filter:blur(12px);animation:cdrift linear infinite}
@keyframes cdrift{to{transform:translateX(640px)}}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.2;transform:scale(.6)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;animation:fl 5s infinite}
@keyframes fl{0%,90%,100%{opacity:0}92%{opacity:.35}95%{opacity:0}97%{opacity:.25}}
.now{display:flex;align-items:center;gap:14px}
.now svg{width:76px;height:76px;flex:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.18))}
.temp{font:700 54px/1 var(--display);letter-spacing:-.04em}
.temp sup{font-size:22px;vertical-align:top;opacity:.75}
.cond{opacity:.85;font-size:14px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div,.days>div{padding:9px 10px;border-radius:16px;background:rgba(255,255,255,.2);font-size:12px;backdrop-filter:blur(6px)}
.stats b{display:block;font:700 16px var(--display)}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;font-size:12px}
.days svg{width:30px;height:30px;display:block;margin:3px auto}
.days b{font-weight:700}
.skel{padding:20px 0;opacity:.85}
.rays{transform-origin:32px 32px;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cl{animation:bob 5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-2.5px)}}
.dr{stroke-dasharray:4 6;animation:dfall 1s linear infinite}
@keyframes dfall{to{stroke-dashoffset:-20}}
.bolt{animation:bl 3s infinite}
@keyframes bl{0%,88%,100%{opacity:1}92%{opacity:.2}}
/* calendar */
.nav{display:flex;gap:6px;align-items:center}
.nav button{width:32px;height:32px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);cursor:pointer;font-size:17px;transition:transform .3s var(--spring),background .2s}
.nav button:hover{background:var(--on);color:var(--onfg);transform:scale(1.12)}
.nav b{min-width:112px;text-align:center;font-weight:700}
.dow,.days-g{display:grid;grid-template-columns:repeat(7,1fr)}
.dow{font-size:12px;color:var(--mute);text-align:center;margin-bottom:4px;font-weight:600}
.days-g{flex:1;grid-auto-rows:minmax(28px,1fr);row-gap:4px}
.days-g.sl{animation:sl .45s var(--spring)}.days-g.sr{animation:sr .45s var(--spring)}
@keyframes sl{from{opacity:0;transform:translateX(28px)}}@keyframes sr{from{opacity:0;transform:translateX(-28px)}}
.d{display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;min-height:0}
.d.out{color:var(--out)}
.d.h{background:var(--hl);color:var(--hlt);border-radius:0}
.d.h.hl{border-radius:12px 0 0 12px}.d.h.hr2{border-radius:0 12px 12px 0}.d.h.hl.hr2{border-radius:12px}
.d.h.est{background:repeating-linear-gradient(135deg,var(--hl2) 0 5px,var(--hl) 5px 10px)}
.d.t{background:var(--on);color:var(--onfg);border-radius:12px;box-shadow:0 0 0 3px var(--panel);position:relative;z-index:1}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--mute);margin-top:10px;flex:none;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;background:var(--hl)}
.legend i.e{background:repeating-linear-gradient(135deg,var(--hl2) 0 3px,#FF9B8F 3px 5px)}.legend i.t{background:var(--on)}
/* next */
.next{background:var(--next);color:#fff}
.odo{display:flex;gap:8px;margin:2px 0 10px}
.dg{--dh:clamp(56px,9vh,86px);width:calc(var(--dh)*.72);height:var(--dh);background:#fff;color:var(--deep);border-radius:16px;overflow:hidden;position:relative;font:800 calc(var(--dh)*.7)/1 var(--display);box-shadow:inset 0 -6px 0 rgba(14,26,58,.1)}
.dg::after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(14,26,58,.14)}
.dg div{transition:transform 1.8s cubic-bezier(.2,.9,.2,1)}
.dg span{display:grid;place-items:center;height:var(--dh)}
.nm{font:700 19px/1.25 var(--display)}.nm span{opacity:.6;font-weight:500}
.note{opacity:.7;font-size:12.5px;margin:8px 0 14px}
.up{list-style:none;padding:0;display:grid;gap:7px}
.up li{display:flex;justify-content:space-between;gap:10px;padding:8px 14px;border-radius:14px;background:rgba(255,255,255,.09);font-size:13px}
.up li span{opacity:.65;white-space:nowrap}.up em{font-style:normal;color:#FF9B8F;font-size:11px;margin-left:6px}
footer{margin-top:10px;color:var(--mute);font-size:11px;text-align:center;flex:none}
.tabs{display:none;position:relative;flex:none;margin-top:10px;padding:5px 5px calc(5px + env(safe-area-inset-bottom,0px));background:var(--panel);border-radius:24px;box-shadow:0 14px 30px -16px var(--shadow)}
.tabs i{position:absolute;top:5px;bottom:calc(5px + env(safe-area-inset-bottom,0px));left:5px;width:calc((100% - 10px)/4);border-radius:19px;background:var(--on);transition:transform .5s var(--spring);transform:translateX(calc(var(--n,0)*100%))}
.tabs button{position:relative;flex:1;background:none;border:0;color:var(--mute);font:700 13px var(--body);padding:11px 2px;cursor:pointer;transition:color .25s}
.tabs button.on{color:var(--onfg)}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
@media(max-width:900px){
  .grid{display:block;grid-template-rows:none}
  .panel{display:none;height:100%;animation-delay:0s}.panel.on{display:flex}
  .tabs{display:flex}footer,.sub{display:none}
  header{margin-bottom:10px}.clocks{gap:6px}.clock{padding:6px 11px;gap:7px}.theme{width:34px;height:34px}.clock b{font-size:14px}.clock span{display:none}
  .cards{grid-template-columns:1fr;grid-auto-rows:minmax(84px,100px)}
  .links{overflow:auto}.sheet{position:static;margin-top:14px;box-shadow:none;background:var(--soft);animation:none}
  .chip{background:var(--panel)}input{background:var(--panel)}
  .temp{font-size:60px}.now svg{width:90px;height:90px}
}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ===== Launchpad v2 ===== */
#chips{display:none}
.pad{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px;align-content:start}
.app{--c:#3B5BFF;--f:#fff;--mx:50%;--my:0%;position:relative;display:flex;flex-direction:column;gap:12px;padding:16px 16px 14px;border-radius:26px;text-decoration:none;color:var(--ink);overflow:hidden;background:linear-gradient(165deg,color-mix(in srgb,var(--c) 16%,var(--panel)),var(--panel) 70%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 22%,transparent),0 14px 28px -20px var(--shadow);transition:transform .45s var(--spring),box-shadow .35s}
.app.in{animation:rise .7s var(--spring) backwards;animation-delay:var(--d,0ms)}
.app::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(220px circle at var(--mx) var(--my),color-mix(in srgb,var(--c) 30%,transparent),transparent 70%)}
.app:hover::after,.app:focus-visible::after{opacity:1}
.app:hover,.app:focus-visible{outline:none;transform:translateY(-6px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 45%,transparent),0 26px 34px -18px var(--c)}
.app:active{transform:scale(.96);transition-duration:.12s}
.ic{position:relative;z-index:1;width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font:800 24px var(--display);color:var(--f);background:linear-gradient(145deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));box-shadow:0 12px 22px -10px var(--c),inset 0 1px rgba(255,255,255,.35);transition:transform .5s var(--spring)}
.app:hover .ic{transform:scale(1.1) rotate(-6deg)}
.app strong{position:relative;z-index:1;font:700 18px/1.15 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
.app em{position:relative;z-index:1;font-style:normal;font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:-6px}
.arr{position:absolute;z-index:1;top:16px;right:16px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--ink);opacity:0;transform:translate(-6px,6px) scale(.7);transition:opacity .25s,transform .45s var(--spring)}
.app:hover .arr,.app:focus-visible .arr{opacity:1;transform:none}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.9);filter:blur(6px)}}

const ink=h=>{const m=/^#?([0-9a-f]{6})$/i.exec(h);if(!m)return'#fff';const n=parseInt(m[1],16),y=(0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255));return y>150?'#0E1A3A':'#fff'};

/* ---------- Supabase: per-user accounts + synced links (publishable key only; RLS keeps each user's rows private) ---------- */
const SB='https://bfyilnggdyiaxfbbrrrx.supabase.co';
const SB_KEY='sb_publishable_uktYUCeSGGcdU-cn992PUg_G68o8dnS';
let sess=null;try{sess=JSON.parse(localStorage.getItem('dash-auth'))}catch(e){}
const saveSess=v=>{sess=v;try{v?localStorage.setItem('dash-auth',JSON.stringify(v)):localStorage.removeItem('dash-auth')}catch(e){}};
const mkSess=d=>({at:d.access_token,rt:d.refresh_token,exp:Date.now()+(d.expires_in||3600)*1000-60000,email:(d.user&&d.user.email)||(sess&&sess.email)||''});
async function auth(path,body){
  const r=await fetch(SB+'/auth/v1/'+path,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.msg||d.error_description||d.message||('Error '+r.status));
  return d;
}
const authErr=()=>{const e=new Error('signed out');e.auth=true;return e};
async function token(){
  if(!sess)throw authErr();
  if(Date.now()>sess.exp){
    try{saveSess(mkSess(await auth('token?grant_type=refresh_token',{refresh_token:sess.rt})))}
    catch(e){saveSess(null);throw authErr()}
  }
  return sess.at;
}
async function sb(path,opt={}){
  const r=await fetch(SB+'/rest/v1/links'+path,{...opt,headers:{apikey:SB_KEY,Authorization:'Bearer '+await token(),'Content-Type':'application/json',...(opt.headers||{})}});
  if(r.status===401){saveSess(null);throw authErr()}
  if(!r.ok){const t=await r.text().catch(()=>'');throw new Error('Supabase '+r.status+(t?': '+t.slice(0,140):''))}
  return r.status===204?null:r.json();
}
const toRow=(l,i)=>({name:l.n,url:l.u,position:i,color:l.c||null});

  const rows=await sb('?select=id,name,url,color',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(list.map((l,i)=>toRow(l,start+i)))});
  return rows.map(fromRow);
}

  if(e&&e.auth){showGate('Please sign in again.');return}

    $('who').textContent=sess.email||'';

    else{
      const pend=links.filter(l=>l.p&&!rows.some(r=>r.u===l.u));    /* links added here that never reached the server */
      if(pend.length)merged=rows.concat(await sbInsert(pend,rows.length));

    else{links=merged;save()}

}

function go(p,keep){
  const same=p==last,st=X.scrollTop,sy=scrollY;last=p;page=p;
  stopScan();closePv();
  const home=p=='home';
  document.querySelector('.grid').style.display=home?'':'none';

  X.classList.toggle('on',!home);
  document.querySelectorAll('.xnav button').forEach(b=>b.classList.toggle('on',b.dataset.p==p));

  X.classList.toggle('still',!!(keep&&same));

  X.scrollTop=keep&&same?st:0;if(!(keep&&same))scrollTo(0,0);else scrollTo(0,sy);

  if(p=='tools'){tcalc();cprev();drawFiles()}
  if(p=='notes'&&nt=='Scans')loadScans();
}
